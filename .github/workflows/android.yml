name: APK Android

on:
  push:
    branches: [main]
    paths: ["android/**", "plantillas/**", "VERSION", ".github/workflows/android.yml"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # necesario solo para publicar el release al crear un tag v*

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Opcional: firma con tu propia clave (ver README). Sin estos secrets se firma con una clave de prueba.
      - name: Preparar clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.CARTERA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cartera.jks"
            echo "CARTERA_KEYSTORE_PATH=$RUNNER_TEMP/cartera.jks" >> "$GITHUB_ENV"
            echo "Firmando con clave propia"
          else
            echo "::warning::Sin clave propia: cada APK se firma distinto y para actualizar hay que desinstalar la anterior."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          CARTERA_KEYSTORE_PASSWORD: ${{ secrets.CARTERA_KEYSTORE_PASSWORD }}
          CARTERA_KEY_ALIAS: ${{ secrets.CARTERA_KEY_ALIAS }}
          CARTERA_KEY_PASSWORD: ${{ secrets.CARTERA_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Borrar clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/cartera.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: pluto-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # Tag v* subido con git -> crea el release.  Release creado desde la web -> le adjunta el APK.
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "pluto-$TAG.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "pluto-$TAG.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "pluto-$TAG.apk" --title "Pluto $TAG" --notes-file .github/release-notes.md --repo "$GITHUB_REPOSITORY"
          fi
