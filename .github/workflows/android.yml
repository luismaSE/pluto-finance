name: APK Android

on:
  push:
    branches: [main]
    paths: ["android/**", "plantillas/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # necesario solo para publicar el release al crear un tag v*

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Opcional: firma con tu propia clave (ver README). Sin estos secrets se firma con una clave de prueba.
      - name: Preparar clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.CARTERA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cartera.jks"
            echo "CARTERA_KEYSTORE_PATH=$RUNNER_TEMP/cartera.jks" >> "$GITHUB_ENV"
            echo "Firmando con clave propia"
          else
            echo "::warning::Sin clave propia: cada APK se firma distinto y para actualizar hay que desinstalar la anterior."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          CARTERA_KEYSTORE_PASSWORD: ${{ secrets.CARTERA_KEYSTORE_PASSWORD }}
          CARTERA_KEY_ALIAS: ${{ secrets.CARTERA_KEY_ALIAS }}
          CARTERA_KEY_PASSWORD: ${{ secrets.CARTERA_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Borrar clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/cartera.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: mi-cartera-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "mi-cartera-$TAG.apk"
          cat > notas.md <<'NOTAS'
          App Android de **Mi cartera**: muestra el dashboard cifrado que genera `python main.py --celular`.

          ### Instalación
          1. Descargá `mi-cartera-*.apk` desde este release, desde el celular.
          2. Abrilo y permití "instalar apps desconocidas" para el navegador o la app de archivos.
          3. Si aparece Play Protect: "Más detalles" → "Instalar de todos modos".
          4. En la app: Configuración → GitHub o Google Drive → Probar conexión → Guardar.

          La configuración completa (repo de datos, tokens, Drive) está en el README.

          > Si el APK no está firmado con una clave propia (secrets `CARTERA_KEYSTORE_*`), para actualizar hay que desinstalar la versión anterior.
          NOTAS
          gh release create "$TAG" "mi-cartera-$TAG.apk" --title "Mi cartera $TAG" --notes-file notas.md --repo "$GITHUB_REPOSITORY"
