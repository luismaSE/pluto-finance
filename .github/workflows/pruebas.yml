name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dependencias
        run: pip install -r requirements-dev.txt
      # El navegador se prueba en una sola versión de Python (alcanza y ahorra tiempo)
      - name: Navegador para probar el dashboard
        if: matrix.python == '3.13'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          echo "PLUTO_NAVEGADOR=1" >> "$GITHUB_ENV"
      - name: Compilar todo el código
        run: python -m compileall -q .
      - name: Pruebas
        run: python -m pytest -v
