# Copiá este archivo como config.toml, o configurá todo desde la app de escritorio (python app.py).
# No pongas secretos acá: los tokens y la contraseña del celular van al llavero del sistema.

[fuentes]
reportes = "reportes"
descargas = "~/Descargas"
importar_descargas = true

# Brokers con API: las credenciales se piden en cada actualización y no se guardan
[brokers.iol]
activo = false

[analisis]
activado = true
proveedor = "claude_code"   # "claude_code", "anthropic", "openai_compatible" u "ollama"

[analisis.claude_code]
modelo = ""                 # "", "opus", "sonnet" o "haiku"

[analisis.anthropic]
modelo = "claude-opus-5-5"  # la clave se guarda en el llavero desde la app (o ANTHROPIC_API_KEY)

[analisis.openai_compatible]
modelo = ""
url = "https://api.openai.com/v1"

[analisis.ollama]
modelo = "llama3.1"
url = "http://localhost:11434"

[referencias]
# Solo se usan si no se puede consultar en línea. 0 = no usar.
tna_plazo_fijo = 0.0      # ej. 0.30 para 30%
inflacion_mensual = 0.0   # ej. 0.025 para 2,5%

[publicar]
destino = "ninguno"   # "github", "drive" o "ninguno"

[publicar.github]
repo = "tu-usuario/repo-de-datos"
ruta = "cartera.enc"
rama = "main"
# Si el token no está en el llavero, se busca en esta variable de entorno o se pide en la terminal.
token_env = "CARTERA_GITHUB_TOKEN"

[publicar.drive]
client_secret = "client_secret.json"
nombre = "cartera.enc"
