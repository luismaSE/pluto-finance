# Copiá este archivo como config.toml (config.toml no se sube al repo).

[publicar]
# Dónde se sube el dashboard cifrado para la app del celular: "github", "drive" o "ninguno"
destino = "github"

[publicar.github]
# Repo PRIVADO solo para el archivo cifrado (distinto del repo del código)
repo = "tu-usuario/cartera-datos"
ruta = "cartera.enc"
rama = "main"
# Token fine-grained con Contents: Read and write SOLO en ese repo.
# Si la variable no existe, se pide en la terminal. Nunca se escribe a disco.
token_env = "CARTERA_GITHUB_TOKEN"

[publicar.drive]
# Credenciales OAuth "App de escritorio" de Google Cloud (ver README)
client_secret = "client_secret.json"
nombre = "cartera.enc"
